services:
  app:
    build: .
    image: taskhub:local
    environment: &app_environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-taskhub}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-taskhub-api}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      REDIS_URL: redis://redis:6379/0
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-taskhub}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.2}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      SMTP_SENDER: ${SMTP_SENDER:-notifications@example.com}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-5}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    image: taskhub:local
    build: .
    environment: *app_environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
