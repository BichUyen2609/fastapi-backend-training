name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DATABASE_URL: postgresql+asyncpg://taskhub:taskhub_ci_only@127.0.0.1:5432/taskhub
      TEST_DATABASE_URL: postgresql+asyncpg://taskhub:taskhub_ci_only@127.0.0.1:5432/taskhub_test
      DATABASE_ECHO: "false"
      PGPASSWORD: taskhub_ci_only
      DEMO_EMAIL: demo@example.test
      DEMO_PASSWORD: taskhub_ci_demo_only
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub_ci_only
          POSTGRES_DB: taskhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub -d taskhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: createdb -h 127.0.0.1 -U taskhub taskhub_test
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -W error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local container configuration
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path

          content = Path('.env.example').read_text(encoding='utf-8')
          lines = [
              'JWT_SECRET=' + secrets.token_urlsafe(48) if line.startswith('JWT_SECRET=')
              else 'ENVIRONMENT=testing' if line.startswith('ENVIRONMENT=')
              else line
              for line in content.splitlines()
          ]
          Path('.env').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify image, API and assignment email
        run: |
          docker compose exec -T app python - <<'PY'
          import json
          import os
          import secrets
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from uuid import uuid4

          assert os.getuid() == 10001
          assert not Path('/app/.env').exists()
          assert not Path('/app/.git').exists()
          base = 'http://127.0.0.1:8000'
          authorization = {}

          def request(path, data=None, form=False, method=None):
              body = None
              headers = dict(authorization)
              if data is not None:
                  body = (urlencode(data) if form else json.dumps(data)).encode()
                  headers['Content-Type'] = 'application/x-www-form-urlencoded' if form else 'application/json'
              with urlopen(Request(base + path, data=body, headers=headers, method=method), timeout=10) as response:
                  return json.load(response)

          assert request('/health/live')['status'] == 'ok'
          assert request('/health/ready') == {'status': 'ready', 'database': 'up', 'cache': 'up'}
          for path in ('/docs', '/redoc', '/openapi.json'):
              with urlopen(base + path, timeout=5) as response:
                  assert response.status == 200
          email = f'container-{uuid4().hex}@example.com'
          password = secrets.token_urlsafe(24)
          user = request('/api/v1/auth/register', {'email': email, 'full_name': 'Container owner', 'password': password})
          token = request('/api/v1/auth/login', {'username': email, 'password': password}, form=True)
          authorization['Authorization'] = 'Bearer ' + token['access_token']
          workspace = request('/api/v1/workspaces', {'name': 'Container workspace'})
          project = request(f"/api/v1/workspaces/{workspace['id']}/projects", {'name': 'Container project'})
          task = request('/api/v1/tasks', {'project_id': project['id'], 'title': 'Container assignment', 'assignee_id': user['id']})
          page = request(f"/api/v1/projects/{project['id']}/tasks")
          assert page['items'] == [task] and page['total'] == 1
          assert request(f"/api/v1/projects/{project['id']}/tasks") == page
          request(f"/api/v1/tasks/{task['id']}", {'title': 'Changed title'}, method='PATCH')
          deadline = time.monotonic() + 15
          while time.monotonic() < deadline:
              with urlopen('http://mailpit:8025/api/v1/messages', timeout=3) as response:
                  messages = json.load(response)
              if messages['total']:
                  break
              time.sleep(0.1)
          assert messages['total'] == 1
          message_id = messages['messages'][0]['ID']
          with urlopen('http://mailpit:8025/api/v1/message/' + message_id, timeout=3) as response:
              message = json.load(response)
          assert message['To'][0]['Address'] == email
          assert 'Container assignment' in message['Text']
          PY
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down --volumes --remove-orphans
